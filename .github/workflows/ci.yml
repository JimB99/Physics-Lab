name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck the physics engine
        run: npx tsc --noEmit -p packages/physics-engine/tsconfig.json
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
